[theme]
base = "light"
primaryColor = "#6d28d9"
backgroundColor = "#f8f7fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#000000"
linkColor = "#6d28d9"
codeTextColor = "#000000"
codeBackgroundColor = "#eeebf7"
borderColor = "#ded8ec"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["42px", "28px", "22px", "20px", "18px", "16px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
blueColor = "#2563eb"
violetColor = "#6d28d9"
greenColor = "#0f766e"

[theme.sidebar]
backgroundColor = "#eeebf8"
secondaryBackgroundColor = "#ffffff"
textColor = "#000000"
borderColor = "#ded8ec"
